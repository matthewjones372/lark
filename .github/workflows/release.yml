# A tag is what cuts a release, and this is what a tag does. Publishing from a
# laptop is how 0.1.0 went out with a version nobody had agreed on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # axion reads the tag to decide the version, and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The gates first. A release that has not passed them is a release nobody
      # can withdraw.
      - run: ./gradlew build

      - id: version
        run: echo "value=$(./gradlew -q currentVersion | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      # A tag can be re-run, and Central refuses a version it already has — with a
      # message about the upload rather than about the re-run. Saying so here is
      # the difference between a red job somebody has to read and a green one.
      - id: already
        run: |
          version="${{ steps.version.outputs.value }}"
          url="https://repo1.maven.org/maven2/io/github/matthewjones372/lark/$version/lark-$version.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          echo "released=$([ "$code" = "200" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "$version is $([ "$code" = "200" ] && echo 'already on Central' || echo 'not on Central yet')"

      # Staged rather than released: the Portal is where somebody looks at what
      # is about to become permanent and presses the button.
      - if: steps.already.outputs.released != 'yes'
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

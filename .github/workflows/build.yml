name: build

on:
  # main only: a branch with a pull request open is already built by the
  # pull_request event, and building it twice buys nothing.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 25 is the floor: the first LTS where a blocking call inside
        # `synchronized` parks its virtual thread instead of pinning the carrier
        # (JEP 491). lark-structured compiles against 27, which the build
        # provisions through its toolchain resolver.
        include:
          - java: "25"
            gradleArgs: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build ${{ matrix.gradleArgs }} --stacktrace

      # The suites run an Api in memory and assert on which thread a body ran
      # on, so a failure is worth reading rather than guessing at.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

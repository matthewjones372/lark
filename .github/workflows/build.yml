name: build

on:
  # main only: a branch with a pull request open is already built by the
  # pull_request event, and building it twice buys nothing.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # A pull request always builds on GitHub's runners: this repository is public, so a pull request can
    # come from anyone and must never run on the home cluster. A push to main uses the repository variable
    # RUNNER if it is set (for example home-lark, lark-bank spec 0017), and GitHub's runners otherwise.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        # 25 is the toolchain and the floor: the first LTS where `synchronized` no longer pins a virtual
        # thread's carrier, which a JDK 21 deadlock under load made a requirement. The Gradle plugin and
        # the compiler plugin still compile for 21, as they run inside the build tools.
        include:
          - java: "25"
            gradleArgs: ""

    steps:
      - uses: actions/checkout@v7

      # 27 as well as the matrix JDK: lark-structured compiles against 27's StructuredTaskScope, and
      # Gradle finds an installed JDK before it downloads one. Its own download picks foojay's
      # Alpine build of 27, which does not run on this glibc runner. The last version listed is the
      # one JAVA_HOME points at, so Gradle itself still runs on the matrix JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build ${{ matrix.gradleArgs }} --stacktrace

      # The suites run an Api in memory and assert on which thread a body ran
      # on, so a failure is worth reading rather than guessing at.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

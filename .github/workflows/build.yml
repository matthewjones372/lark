name: build

on:
  # main only: a branch with a pull request open is already built by the
  # pull_request event, and building it twice buys nothing.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it. The
# earlier answer is about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain the module compiles against and the floor for
        # virtual threads, so it is what the published bytecode has to keep
        # working on; 25 is what the repo is developed and run on, and the
        # first LTS where `synchronized` no longer pins a carrier.
        include:
          - java: "21"
            gradleArgs: ""
          - java: "25"
            gradleArgs: ""

    steps:
      - uses: actions/checkout@v7

      # 27 as well as the matrix JDK: lark-structured compiles against 27's StructuredTaskScope, and
      # Gradle finds an installed JDK before it downloads one. Its own download picks foojay's
      # Alpine build of 27, which does not run on this glibc runner. The last version listed is the
      # one JAVA_HOME points at, so Gradle itself still runs on the matrix JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            27
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build ${{ matrix.gradleArgs }} --stacktrace

      # The suites run an Api in memory and assert on which thread a body ran
      # on, so a failure is worth reading rather than guessing at.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

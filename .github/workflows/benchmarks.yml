name: benchmarks

# The stream modules measured on the base branch and on the pull request, back to back on one runner, and
# red when a row got slower (lark-stream-benchmarks/gate.sh). A committed number was measured on some other
# machine, so the gate compares only what it measured itself.
on:
  pull_request:
    paths:
      - "lark-stream/**"
      - "lark-stream-pekko/**"
      - "lark-stream-forks/**"
      - "lark-stream-benchmarks/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch has to be there for gate.sh to put it in a worktree beside this checkout.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Benchmarks on the base and on this change
        run: lark-stream-benchmarks/gate.sh "origin/${{ github.base_ref || 'main' }}"

      # Every run's rows, so drift shows up in the history before it trips the gate.
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-compare
          path: |
            lark-stream-benchmarks/build/jmh-compare.txt
            lark-stream-benchmarks/build/jmh-result.json
          retention-days: 90

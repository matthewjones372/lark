# What ActorTestKit.create(name) loads: ConfigFactory.load("application-test").
#
# LoggingTestKit reads log events back through a logback appender, and the
# classic `system.log()` this library reports a defect through publishes to the
# event stream. Routing that stream through SLF4J is what puts the two ends of
# the assertion on the same wire.
pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "DEBUG"
}

// Applied by gate.sh to either side's build, the base's included, so it works on any ref whose benchmarks have a
// `jmh` task: writes the JVM that task would launch and its classpath to $GATE_CLASSPATH, for gate.sh to run JMH
// with directly, one benchmark at a time.
allprojects {
    if (name == 'lark-stream-benchmarks') {
        tasks.matching { it.name == 'jmh' }.configureEach { JavaExec jmh ->
            jmh.doFirst {
                new File(System.getenv('GATE_CLASSPATH')).text =
                    jmh.javaLauncher.get().executablePath.asFile.path + '\n' + jmh.classpath.asPath + '\n'
            }
        }
    }
}

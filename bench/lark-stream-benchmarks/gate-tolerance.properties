# How much slower a row may get before jmhCompare fails the gate, for the rows the default (-Ptolerance, 10%)
# does not suit. A key is a benchmark class, or a class and method, and the longest key that names a row wins.
#
# A row is listed here only after the gate failed it on identical code, with the run that showed it.

# A virtual thread or a tell per element, and the four runners' scheduling on top: forks of identical code
# disagree by up to 131%. MapParBenchmark.actors read +20.7 +36.8 +21.6 -42.7 +89.6 +54.3 against main on
# lark#462 with no stream code changed (actions run 39614875255).
MapParBenchmark=0.50

# merge and buffer hand each element from one thread to another, and on Actors to the four runners: a fork lands
# well or badly. HandOffBenchmark.bufferActors read +31.3 +46.7 -15.8 +18.7 +69.6 +7.8 on main against itself
# (actions run 39642091758), and mergeActors needed a second look in two of five identical-code runs.
HandOffBenchmark=0.50

# A thousand actors at once queue for the same four runners. Read +26.4 +62.5 +17.6 -6.5 +6.8 +4.9 against itself,
# one round short of failing (actions run 39621153332). ManyRunsBenchmark.forks keeps the default.
ManyRunsBenchmark.actors=0.50

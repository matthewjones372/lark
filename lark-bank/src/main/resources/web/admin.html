<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Bank Admin</title>
  <link rel="stylesheet" href="/bank.css">
</head>
<body>
  <header>
    <h1>Lark Bank</h1>
    <nav><a href="/">Accounts</a> <a href="/admin" aria-current="page">Admin</a></nav>
  </header>

  <main>
    <section class="controls">
      <button id="load" type="button">Start load</button>
      <button id="crash" type="button" class="danger">Crash n3</button>
      <span id="stream" class="muted">connecting…</span>
    </section>

    <section class="tiles">
      <div class="tile"><span class="label">Transfers a second</span><strong id="tps">0</strong></div>
      <div class="tile"><span class="label">Refused a second</span><strong id="refused">0</strong></div>
      <div class="tile"><span class="label">p99 (ms)</span><strong id="p99">0</strong></div>
    </section>

    <section class="card">
      <h2>Transfers a second, last five minutes</h2>
      <canvas id="sparkline" height="80"></canvas>
    </section>

    <div class="columns">
      <section class="card">
        <h2>Nodes</h2>
        <table>
          <thead>
            <tr>
              <th>Node</th><th>Status</th><th class="number">Shards</th><th class="number">Entities</th>
              <th class="number">Unconfirmed</th><th class="number">Dead letters</th>
            </tr>
          </thead>
          <tbody id="nodes"></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Transfers</h2>
        <table>
          <thead><tr><th>From</th><th>To</th><th class="number">Amount</th><th>Outcome</th><th class="number">ms</th></tr></thead>
          <tbody id="feed"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>

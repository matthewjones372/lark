<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Bank</title>
  <link rel="stylesheet" href="/bank.css">
</head>
<body>
  <header>
    <h1>Lark Bank</h1>
    <nav><a href="/" aria-current="page">Accounts</a> <a href="/admin">Admin</a></nav>
  </header>

  <main class="columns">
    <section class="card">
      <h2>Account</h2>
      <form id="pick">
        <label>Account id <input id="account-id" required pattern="[A-Za-z0-9_\-]{1,64}" placeholder="alice"></label>
        <label>Opening amount <input id="open-amount" type="number" min="0" value="1000"></label>
        <div class="buttons">
          <button id="show" type="submit">Show</button>
          <button id="open" type="button" class="secondary">Open</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card" id="account" hidden>
      <h2 id="account-name"></h2>
      <p class="balance">Balance <strong id="balance"></strong></p>

      <form id="send-form">
        <label>To <input id="to" required placeholder="bob"></label>
        <label>Amount <input id="amount" type="number" min="1" required></label>
        <button id="send" type="submit">Send</button>
      </form>
      <p>Last transfer: <span id="transfer-status" class="status">none yet</span></p>

      <h3>Latest movements</h3>
      <table id="movements">
        <thead><tr><th>Transfer</th><th class="number">Amount</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/consumer.js"></script>
</body>
</html>
